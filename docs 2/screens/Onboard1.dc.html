<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ISO · Join</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#080808}
a{color:#C8873A}a:hover{color:#E0A35A}
input::placeholder{color:#8f8f8f}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #080808; color: #E0E0E0; font-family: 'Manrope', sans-serif">
  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 112px; overflow-y: auto; padding: 60px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 0.06em; color: #E0E0E0">ISO</span>
      <span style="font-size: 12px; font-weight: 700; color: #AAAAAA">Step 1 of 3</span>
    </div>
    <div style="display: flex; gap: 6px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #C8873A"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #2a2a2a"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #2a2a2a"></span></div>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 44px; line-height: 0.95; text-transform: uppercase; color: #FFFFFF">You're not lost.<br><span style="color: #C8873A">You're in search of.</span></h1>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.16em; color: #AAAAAA">I'M HERE TO</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-if value="{{isPlayer}}" hint-placeholder-val="{{true}}">
          <button type="button" aria-pressed="true" onClick="{{pickPlayer}}" style="padding: 14px; border-radius: 16px; border: 2px solid #C8873A; background: #1a140c; color: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 800">Play</span><span style="font-size: 12px; color: rgb(170, 170, 170)">Join ISO as a player. Call your ISO, rise to the challenge.</span></button>
          <button type="button" aria-pressed="false" onClick="{{pickCoach}}" style="padding: 14px; border-radius: 16px; border: 1px solid #333; background: #141414; color: #E0E0E0; font-family: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 800">Coach</span><span style="font-size: 12px; color: rgb(170, 170, 170)">Join ISO as a coach. Host ISOs, pull as you climb.</span></button>
        </sc-if>
        <sc-if value="{{isCoach}}" hint-placeholder-val="{{false}}">
          <button type="button" aria-pressed="false" onClick="{{pickPlayer}}" style="padding: 14px; border-radius: 16px; border: 1px solid #333; background: #141414; color: #E0E0E0; font-family: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 800"><span style="color: rgb(255, 255, 255)">Play<br></span><span style="font-weight: 400; font-size: 12px; color: rgb(170, 170, 170)">Join ISO as a player. Call your ISO, rise to the challenge.</span></span></button>
          <button type="button" aria-pressed="true" onClick="{{pickCoach}}" style="padding: 14px; border-radius: 16px; border: 2px solid #C8873A; background: #1a140c; color: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 800">Coach</span><span style="font-size: 12px; color: #AAAAAA">Host ISOs, pull as you climb</span></button>
        </sc-if>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="name" style="font-size: 12px; font-weight: 700; color: #AAAAAA">First name</label><input id="name" type="text" placeholder="What should people call you?" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #333; background: #141414; color: #FFFFFF; font-family: inherit; font-size: 15px"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="phone" style="font-size: 12px; font-weight: 700; color: #AAAAAA">Phone</label><input id="phone" type="tel" placeholder="For ISO reminders and check-in" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #333; background: #141414; color: #FFFFFF; font-family: inherit; font-size: 15px"></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="city" style="font-size: 12px; font-weight: 700; color: #AAAAAA">City</label><input id="city" type="text" value="Denver, CO" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #333; background: #141414; color: #FFFFFF; font-family: inherit; font-size: 15px"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="bday" style="font-size: 12px; font-weight: 700; color: #AAAAAA">Birthday</label><input id="bday" type="text" placeholder="MM / DD / YYYY" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #333; background: #141414; color: #FFFFFF; font-family: inherit; font-size: 15px"></div>
      </div>
      <span style="font-size: 12px; color: #8f8f8f">ISOs are 18+ and happen only at verified ISO Partner spots. Real names and verified phones keep every table safe.</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 112px; box-sizing: border-box; padding: 14px 20px 30px; background: #0b0b0b; border-top: 1px solid #1f1f1f; display: flex; flex-direction: column; justify-content: center">
    <sc-if value="{{isPlayer}}" hint-placeholder-val="{{true}}">
      <a href="Onboard2.dc.html" style="height: 52px; border-radius: 14px; background: #C8873A; color: #080808; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; text-decoration: none">Continue</a>
    </sc-if>
    <sc-if value="{{isCoach}}" hint-placeholder-val="{{false}}">
      <a href="CoachApply.dc.html" style="height: 52px; border-radius: 14px; background: #C8873A; color: #080808; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; text-decoration: none">Continue to coach application</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { role: 'player' }; }
  renderVals() {
    const p = this.state.role === 'player';
    return {
      isPlayer: p,
      isCoach: !p,
      pickPlayer: () => this.setState({ role: 'player' }),
      pickCoach: () => this.setState({ role: 'coach' })
    };
  }
}
</script>
</body>
</html>

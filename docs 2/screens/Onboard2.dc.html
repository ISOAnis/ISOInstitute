<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ISO · Choose your pathway</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#080808}
a{color:#C8873A}a:hover{color:#E0A35A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #080808; color: #E0E0E0; font-family: 'Manrope', sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 6px; background: {{cur.fill}}"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 112px; overflow-y: auto; padding: 54px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Onboard1.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -8px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #E0E0E0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <span style="font-size: 12px; font-weight: 700; color: #AAAAAA">Step 2 of 3</span>
    </div>
    <div style="display: flex; gap: 6px"><span style="flex: 1; height: 4px; border-radius: 2px; background: {{cur.fill}}"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: {{cur.fill}}"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #2a2a2a"></span></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 42px; line-height: 0.95; text-transform: uppercase; color: #FFFFFF">Pick your pathway</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #AAAAAA">Your app takes on your pathway's color. You get first call on seats at your pathway's ISOs, and can still join any ISO with open seats.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{paths}}" as="p" hint-placeholder-count="6">
        <sc-if value="{{p.active}}" hint-placeholder-val="{{false}}">
          <button type="button" aria-pressed="true" onClick="{{p.pick}}" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; border: 2px solid {{p.fill}}; background: {{p.tint}}; font-family: inherit; text-align: left; cursor: pointer">
            <span style="width: 12px; height: 40px; flex: none; border-radius: 6px; background: {{p.fill}}"></span>
            <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; line-height: 1; text-transform: uppercase; color: {{p.text}}">{{p.name}}</span><span style="font-size: 13px; color: #E0E0E0">{{p.desc}}</span></span>
            <span style="width: 26px; height: 26px; border-radius: 50%; background: {{p.fill}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
          </button>
        </sc-if>
        <sc-if value="{{p.inactive}}" hint-placeholder-val="{{true}}">
          <button type="button" aria-pressed="false" onClick="{{p.pick}}" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; border: 1px solid #2a2a2a; background: #121212; font-family: inherit; text-align: left; cursor: pointer">
            <span style="width: 12px; height: 40px; flex: none; border-radius: 6px; background: {{p.fill}}; opacity: 0.55"></span>
            <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; line-height: 1; text-transform: uppercase; color: #E0E0E0">{{p.name}}</span><span style="font-size: 13px; color: #AAAAAA">{{p.desc}}</span></span>
            <span style="width: 26px; height: 26px; border-radius: 50%; border: 2px solid #3a3a3a; box-sizing: border-box"></span>
          </button>
        </sc-if>
      </sc-for>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #121212; border: 1px solid #222">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C8873A" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <span style="font-size: 12px; line-height: 1.45; color: #AAAAAA">Commit to it. You can switch pathways twice a month, so your coaches and crew know where you're headed.</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 112px; box-sizing: border-box; padding: 14px 20px 30px; background: #0b0b0b; border-top: 1px solid #1f1f1f; display: flex; flex-direction: column; justify-content: center">
    <a href="Onboard3.dc.html" style="height: 52px; border-radius: 14px; background: #C8873A; color: #080808; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: 15px; text-decoration: none"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{cur.fill}}; box-shadow: 0 0 0 2px #080808"></span>Lock in {{cur.name}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { path: 'Builder' }; }
  renderVals() {
    const list = [
      { name: 'Founder', desc: 'Entrepreneurship & business', fill: '#e65100', text: '#ff8a50', tint: 'rgba(230,81,0,0.12)' },
      { name: 'Builder', desc: 'Engineering & tech', fill: '#8e24aa', text: '#c77ddb', tint: 'rgba(142,36,170,0.14)' },
      { name: 'Healer', desc: 'Medicine & healthcare', fill: '#1e88e5', text: '#64b5f6', tint: 'rgba(30,136,229,0.12)' },
      { name: 'Reformer', desc: 'Law & public policy', fill: '#00acc1', text: '#4dd0e1', tint: 'rgba(0,172,193,0.12)' },
      { name: 'Warrior', desc: 'Health, fitness & athletics', fill: '#e53935', text: '#ef7470', tint: 'rgba(229,57,53,0.12)' },
      { name: 'Seeker', desc: 'Deen, purpose & character', fill: '#1db954', text: '#4cd47b', tint: 'rgba(29,185,84,0.12)' }
    ];
    const cur = list.find((p) => p.name === this.state.path) || list[1];
    return {
      cur: cur,
      paths: list.map((p) => Object.assign({}, p, { active: this.state.path === p.name, inactive: this.state.path !== p.name, pick: () => this.setState({ path: p.name }) }))
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ISO · Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a0a}
a{color:#C8873A}a:hover{color:#E0A35A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 42%, #1f1f1f 0%, #121212 45%, #0a0a0a 80%); color: #E0E0E0; font-family: 'Manrope', sans-serif">

  <!-- Logo mark (tap to replay the intro) -->
  <button type="button" aria-label="ISO logo, tap to replay intro" onClick="{{replay}}" style="position: absolute; left: 50%; top: 236px; width: 168px; height: 130px; margin-left: -84px; padding: 0; border: none; background: transparent; cursor: pointer; transform: {{logoTransform}}; transition: transform 900ms cubic-bezier(0.2, 0.8, 0.2, 1)">
    <img src="/_blob/68a6f7bc2e7c795e2ccde03f40b76ad8" alt="" style="width: 168px; height: 130px; object-fit: contain; display: block">
  </button>

  <!-- Intro line -->
  <div aria-hidden="{{introHidden}}" style="position: absolute; left: 0; right: 0; top: 420px; display: flex; flex-direction: column; align-items: center; font-family: 'Bebas Neue', sans-serif; font-size: 46px; line-height: 0.98; letter-spacing: 0.01em; color: #FFFFFF; text-align: center; opacity: {{introOpacity}}; transition: opacity 500ms ease">
    <span>You're not lost.</span>
    <span>You're <span style="background: linear-gradient(100deg, #9a9a9a 0%, #e8e8e8 45%, #a8a8a8 70%, #d6d6d6 100%); -webkit-background-clip: text; background-clip: text; color: transparent">in search of.</span></span>
  </div>

  <!-- Welcome block -->
  <div style="position: absolute; left: 24px; right: 24px; top: 300px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; opacity: {{readyOpacity}}; transform: translateY({{readyShift}}px); transition: opacity 600ms ease 250ms, transform 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 250ms">
    <span style="font-family: 'Bebas Neue', sans-serif; font-size: 84px; line-height: 0.9; letter-spacing: 0.14em; padding-left: 0.14em; background: linear-gradient(100deg, #9a9a9a 0%, #f0f0f0 45%, #a8a8a8 70%, #dcdcdc 100%); -webkit-background-clip: text; background-clip: text; color: transparent">ISO</span>
    <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.32em; color: #AAAAAA">IN SEARCH OF</span>
    <span style="margin-top: 22px; font-family: 'Bebas Neue', sans-serif; font-size: 34px; line-height: 1.02; color: #FFFFFF">Where culture, community,<br>and <span style="color: #C8873A">ambition</span> intersect.</span>
    <span style="margin-top: 6px; font-size: 14px; line-height: 1.5; color: #AAAAAA">Community coaching, in person, with people who've already done what you're trying to do.</span>
  </div>

  <!-- Actions -->
  <div style="position: absolute; left: 24px; right: 24px; bottom: 44px; display: flex; flex-direction: column; gap: 12px; opacity: {{readyOpacity}}; transform: translateY({{actionsShift}}px); transition: opacity 600ms ease 450ms, transform 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 450ms">
    <a href="Onboard1.dc.html" style="height: 54px; border-radius: 14px; background: #C8873A; color: #080808; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; text-decoration: none">Sign up</a>
    <a href="Main.dc.html" style="height: 54px; border-radius: 14px; border: 1px solid #444; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; text-decoration: none">Log in</a>
    <span style="font-size: 11px; line-height: 1.5; text-align: center; color: #8f8f8f">By continuing you agree to ISO's Terms and Privacy Policy.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ready: false }; this.timer = null; }
  componentDidMount() { this.start(); }
  componentWillUnmount() { if (this.timer) clearTimeout(this.timer); }
  start() {
    if (this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(() => this.setState({ ready: true }), 1800);
  }
  renderVals() {
    const r = this.state.ready;
    return {
      logoTransform: r ? 'translateY(-120px) scale(0.72)' : 'translateY(0px) scale(1)',
      introOpacity: r ? 0 : 1,
      introHidden: r ? 'true' : 'false',
      readyOpacity: r ? 1 : 0,
      readyShift: r ? 0 : 24,
      actionsShift: r ? 0 : 30,
      replay: () => { this.setState({ ready: false }); this.start(); }
    };
  }
}
</script>
</body>
</html>

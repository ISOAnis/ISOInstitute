      <circle cx="264.0" cy="280.0" r="7" fill="#EDEDF0"/><circle cx="264.0" cy="280.0" r="16" fill="none" stroke="#6a6a72" stroke-width="1.2"/>
      <circle class="iso-glow" cx="1176.0" cy="280.0" r="8" fill="#C8873A"/><circle cx="1176.0" cy="280.0" r="17" fill="none" stroke="#C8873A" stroke-width="1.2" opacity=".6"/>

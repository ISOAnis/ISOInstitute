<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="236 0 968 310" preserveAspectRatio="xMidYMid meet">
      <style>@keyframes isoDrift{to{stroke-dashoffset:-60}}@keyframes isoGlow{0%,100%{opacity:.45}50%{opacity:1}}.iso-drift{animation:isoDrift 3.2s linear infinite}.iso-glow{animation:isoGlow 2.8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.iso-drift,.iso-glow{animation:none}}</style>
      <defs>
        <linearGradient id="isoArcG" x1="0" x2="1"><stop offset="0" stop-color="#cfcfd4"/><stop offset=".45" stop-color="#C8873A"/><stop offset="1" stop-color="#E0A35A"/></linearGradient>
        <filter id="isoArcGlow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <path d="M264.0 280.0 C 534.0 -60, 906.0 -60, 1176.0 280.0" fill="none" stroke="#C8873A" stroke-width="8" opacity=".18" filter="url(#isoArcGlow)"/>
